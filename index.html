<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dil Ke Halat | MASTER NK</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Georgia, serif;
    background: #0b0b12;
    color: #f5f0e8;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 55px 20px 35px;
    background: linear-gradient(180deg, #171321, #0b0b12);
}

header h1 {
    font-size: 42px;
    letter-spacing: 2px;
}

header p {
    margin-top: 12px;
    color: #c9bfc9;
    font-size: 18px;
}

nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 15px;
}

nav button {
    background: #191725;
    color: #eee;
    border: 1px solid #393444;
    padding: 9px 15px;
    border-radius: 20px;
    cursor: pointer;
}

nav button:hover {
    background: #29243a;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.shayari {
    background: #15141d;
    border: 1px solid #2d2a38;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.shayari h2 {
    margin-bottom: 18px;
    font-size: 23px;
}

.shayari-text {
    white-space: pre-line;
    line-height: 1.9;
    font-size: 18px;
    color: #e9e2da;
}

.author {
    text-align: right;
    margin-top: 20px;
    color: #b9a9c4;
}

.actions {
    margin-top: 18px;
    display: flex;
    gap: 10px;
}

.actions button,
.add-btn,
.form button {
    border: none;
    border-radius: 10px;
    padding: 10px 15px;
    cursor: pointer;
    background: #29243a;
    color: white;
}

.add-btn {
    display: block;
    margin: 25px auto;
    font-size: 17px;
    padding: 13px 22px;
}

.form-box {
    display: none;
    background: #15141d;
    border: 1px solid #393444;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 30px;
}

.form-box input,
.form-box textarea,
.form-box select {
    width: 100%;
    margin: 8px 0 16px;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #393444;
    background: #0d0c13;
    color: white;
    font-size: 16px;
}

.form-box textarea {
    min-height: 150px;
    resize: vertical;
}

footer {
    text-align: center;
    padding: 40px 20px;
    color: #88818c;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #aaa;
}

@media(max-width:600px) {
    header h1 {
        font-size: 32px;
    }

    .shayari {
        padding: 20px;
    }

    .shayari-text {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🌙 Dil Ke Halat</h1>
    <p>— Alfaaz jo dil se nikle —</p>
    <p>✍️ MASTER NK</p>
</header>

<nav>
    <button onclick="showCategory('All')">All</button>
    <button onclick="showCategory('Love')">❤️ Love</button>
    <button onclick="showCategory('Sad')">💔 Sad</button>
    <button onclick="showCategory('Dard')">🥀 Dard</button>
    <button onclick="showCategory('Romantic')">🌙 Romantic</button>
    <button onclick="showCategory('Life')">✨ Life</button>
</nav>

<div class="container">

    <button class="add-btn" onclick="toggleForm()">
        ➕ Add New Shayari
    </button>

    <div class="form-box" id="formBox">

        <h2>✍️ Apni Shayari Add Karein</h2>

        <input id="title" type="text" placeholder="Shayari ka title">

        <select id="category">
            <option value="Love">❤️ Love</option>
            <option value="Sad">💔 Sad</option>
            <option value="Dard">🥀 Dard</option>
            <option value="Romantic">🌙 Romantic</option>
            <option value="Life">✨ Life</option>
        </select>

        <textarea id="text" placeholder="Yahan apni shayari likho..."></textarea>

        <button onclick="addShayari()">Publish Shayari</button>

    </div>

    <div id="shayariContainer"></div>

</div>

<footer>
    <p>© 2026 Dil Ke Halat</p>
    <p>Written by MASTER NK ❤️</p>
</footer>

<script>

let shayaris = JSON.parse(localStorage.getItem("masterNKShayari")) || [

    {
        title: "Adhoora Ishq",
        category: "Love",
        text: "Tere bina bhi jee rahe hain hum,\nMagar har saans mein kami si hai,\nTu paas nahi hai mere,\nPhir bhi dil mein teri hi nami si hai."
    },

    {
        title: "Khamoshi",
        category: "Dard",
        text: "Kuch baatein lafzon ki mohtaaj nahi hoti,\nKuch dard ki koi awaaz nahi hoti,\nSamajhne wala ho agar koi,\nToh khamoshi bhi ek kitaab hoti hai."
    }

];

let currentCategory = "All";

function saveData() {
    localStorage.setItem("masterNKShayari", JSON.stringify(shayaris));
}

function displayShayari() {

    const container = document.getElementById("shayariContainer");

    container.innerHTML = "";

    let filtered = currentCategory === "All"
        ? shayaris
        : shayaris.filter(s => s.category === currentCategory);

    if (filtered.length === 0) {
        container.innerHTML =
            '<div class="empty">Is category mein abhi koi shayari nahi hai. ❤️</div>';
        return;
    }

    filtered.forEach((s, index) => {

        const div = document.createElement("div");

        div.className = "shayari";

        div.innerHTML = `
            <h2>${escapeHTML(s.title)}</h2>

            <div class="shayari-text">${escapeHTML(s.text)}</div>

            <div class="author">— MASTER NK</div>

            <div class="actions">
                <button onclick="copyShayari(${index})">📋 Copy</button>
                <button onclick="shareShayari(${index})">↗️ Share</button>
            </div>
        `;

        container.appendChild(div);

    });
}

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function showCategory(category) {

    currentCategory = category;
    displayShayari();

}

function toggleForm() {

    const form = document.getElementById("formBox");

    if (form.style.display === "block") {
        form.style.display = "none";
    } else {
        form.style.display = "block";
        form.scrollIntoView({behavior: "smooth"});
    }

}

function addShayari() {

    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const text = document.getElementById("text").value.trim();

    if (!title || !text) {
        alert("Title aur Shayari dono likhna zaroori hai ❤️");
        return;
    }

    shayaris.unshift({
        title: title,
        category: category,
        text: text
    });

    saveData();

    document.getElementById("title").value = "";
    document.getElementById("text").value = "";

    document.getElementById("formBox").style.display = "none";

    currentCategory = "All";

    displayShayari();

    alert("Shayari successfully add ho gayi ❤️");

}

function copyShayari(index) {

    const s = shayaris[index];

    const text =
        s.title + "\n\n" +
        s.text + "\n\n" +
        "— MASTER NK\nDil Ke Halat";

    navigator.clipboard.writeText(text);

    alert("Shayari copy ho gayi 📋");

}

function shareShayari(index) {

    const s = shayaris[index];

    const text =
        s.title + "\n\n" +
        s.text + "\n\n" +
        "— MASTER NK\nDil Ke Halat";

    if (navigator.share) {

        navigator.share({
            title: s.title,
            text: text
        });

    } else {

        navigator.clipboard.writeText(text);
        alert("Share option available nahi hai, text copy kar diya gaya 📋");

    }

}

displayShayari();

</script>

</body>
          </html>
